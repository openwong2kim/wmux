name: Perf

on:
  workflow_dispatch:
  push:
    branches: [main]
    # The trend line is published to the `bench-history` branch, so no CI commit
    # lands on main and nothing here can re-trigger this workflow (#602).
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths:
      - 'src/**'
      # Every perf harness module, not an explicit allow-list: perf-bench.mjs
      # imports perf-process-classify.mjs and perf-process-tree.mjs, so a PR
      # touching only a helper (e.g. the tree-walk contamination guard, #570)
      # must still re-run the gate. A named list silently skipped those.
      - 'scripts/perf-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/perf.yml'
      - 'forge.config.*'

concurrency:
  group: perf-${{ github.ref }}
  # Cancel superseded PR runs, but never kill a main-push run mid-flight — the
  # history append happens at the END of the job, so cancelling main runs would
  # make the trend file routinely lossy under normal merge cadence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # #940: `fresh-confirm-needed` is what hands a reproduced red to the
    # bench-confirm job below. It is derived from the escalation FILE the
    # compare step writes, never from the step's exit code — if the file could
    # not be written, compare kept the red itself, so a missing file always
    # means "nothing to escalate".
    outputs:
      fresh-confirm-needed: ${{ steps.escalation.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package app
        run: npm run package

      # The harness exits nonzero on a *harness* failure (could not launch the
      # packaged app, etc.) — that must fail the job.
      - name: Run perf bench
        run: node scripts/perf-bench.mjs --mode ci --json out/perf-current.json

      # On push to main the same compare invocation also writes this run's trend
      # line. It goes to a fresh single-line file, not to the accumulated trend:
      # the trend lives on the `bench-history` branch and is only ever read and
      # extended by the publish step below, so the build tree never carries a
      # stale copy of it. Compute the extra flag once.
      - name: Compute history flag
        id: histflag
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            "value=--append-history out/perf-history-line.ndjson" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "value=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      # Gate. baseline-ci.json may not exist yet — compare prints
      # "no baseline — record-only run" and exits 0 (bootstrap path). A real
      # regression past both thresholds exits 1.
      #
      # --confirm-retry (#570): on a red, the bench legs behind the failing
      # metrics are measured once more, in this same process, and the failure
      # only stands if it reproduces. A deterministic regression should; a
      # runner interference spike should not. It is deliberately NOT a second
      # step — the confirmation is handed the very numbers this invocation
      # judged, so nothing can change underneath it between two steps and there
      # is no handshake file that could describe a different run. Everything
      # that is not an explicit second PASS keeps the exit code at 1, so this
      # step's failure remains the job's verdict, with no continue-on-error
      # anywhere and nothing chained after the command that could swallow it.
      # scripts/__tests__/perfWorkflow.test.mjs pins that, because nothing else
      # checks YAML.
      #
      # --escalate (#940): the one red the same-runner re-run cannot settle —
      # it REPRODUCED here — is written to out/perf-escalation.json and this
      # step exits 0; the bench-confirm job below re-measures on a fresh
      # machine and carries the verdict. Every other red (transient blips that
      # cleared, correctness gates, harness failures) keeps its exit code
      # here, exactly as before.
      - name: Compare against baseline
        run: node scripts/perf-compare.mjs --current out/perf-current.json --baseline bench/baseline-ci.json --summary perf-summary.md --confirm-retry out/perf-retry.json --escalate out/perf-escalation.json ${{ steps.histflag.outputs.value }}

      # #940: turn the escalation file's existence into the job output that
      # triggers bench-confirm. Nothing else — the file is the contract, and
      # perfWorkflow.test.mjs pins that this step stays a literal existence
      # check (an `if:` here, or a rewrite, could silently orphan an escalated
      # red into a green run).
      - name: Detect escalation
        id: escalation
        run: |
          if (Test-Path out/perf-escalation.json) {
            "needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Append summary to step summary
        if: always()
        run: |
          if (Test-Path perf-summary.md) {
            Get-Content perf-summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ github.run_id }}
          path: |
            out/perf-current.json
            out/perf-retry.json
            out/perf-escalation.json
            out/perf-history-line.ndjson
            perf-summary.md
          if-no-files-found: ignore

      # Publish the trend line to the unprotected `bench-history` branch. It is
      # deliberately NOT on main: this bot cannot push to a protected branch, and
      # the resulting rejection was silent for six weeks (#602).
      #
      # `!cancelled()` rather than `success()`: a run that failed the gate is
      # exactly the data point a noise investigation needs (#570), and the old
      # step's plain `if:` skipped every red run. A *cancelled* run is excluded —
      # its measurement may be half-finished and is not worth publishing.
      - name: Publish perf history
        if: ${{ !cancelled() && github.event_name == 'push' }}
        shell: pwsh
        run: |
          $lineFile = 'out/perf-history-line.ndjson'
          if (-not (Test-Path $lineFile)) {
            Write-Host 'No trend line produced (the run never reached the compare step) — nothing to publish.'
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The existing trend is read back through PowerShell as text before
          # being rewritten, so pin the decode rather than inherit the runner's
          # code page. Every field written today is ASCII; this is what keeps a
          # future non-ASCII one from being mangled in transit.
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

          $branch = 'bench-history'
          $file = 'history.ndjson'
          $scratch = Join-Path $env:RUNNER_TEMP 'perf-history.ndjson'
          # Scratch index for write-tree — never the repo's own index.
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'perf-history.index'

          # The commit is assembled with plumbing instead of a checkout: the
          # working tree holds the packaged app, and swapping branches in it to
          # append one line would be slow and needlessly destructive.
          $pushed = $false
          for ($attempt = 1; $attempt -le 3 -and -not $pushed; $attempt++) {
            # A missing branch is the bootstrap path, not an error — the first
            # run after this lands creates it with one parentless commit.
            #
            # A fetch that fails for some *other* reason lands here too, and
            # cannot do harm: it produces a parentless commit, and pushing one of
            # those at an existing branch is not a fast-forward, so the server
            # rejects it and the next attempt re-reads. Nothing here ever forces,
            # which is what makes "could not read the tip" unable to erase it.
            $parent = $null
            git fetch --no-tags --depth=1 origin $branch 2>$null
            if ($LASTEXITCODE -eq 0) { $parent = (git rev-parse FETCH_HEAD).Trim() }

            $existing = @()
            if ($parent) {
              $fromBranch = @(git cat-file -p "${parent}:${file}")
              if ($LASTEXITCODE -ne 0) {
                # The branch is there but its trend file did not read. Treating
                # that as "no trend yet" would replace the whole series with this
                # one line, so refuse: retry, and fail loudly rather than truncate.
                Write-Host "Could not read $file from '$branch' — refusing to overwrite the trend."
                if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
                continue
              }
              $existing = $fromBranch
            }
            $all = $existing + @(Get-Content $lineFile)
            # WriteAllText, not Set-Content: LF and no BOM on either PowerShell
            # edition, matching the lines perf-compare.mjs itself writes.
            [System.IO.File]::WriteAllText($scratch, ($all -join "`n") + "`n")

            # --no-filters: store the bytes just written, with no CRLF/attribute
            # conversion applied on the way in. The trend file is LF by contract.
            $blob = (git hash-object -w --no-filters $scratch).Trim()
            # Build the tree through a scratch index rather than `git mktree`:
            # --cacheinfo takes the path as an argument, so nothing can smuggle
            # the CR of a Windows line ending into the filename the way piping
            # an entry to mktree's stdin does.
            Remove-Item $env:GIT_INDEX_FILE -Force -ErrorAction SilentlyContinue
            git update-index --add --cacheinfo "100644,$blob,$file"
            $tree = (git write-tree).Trim()
            # The first commit says what the branch is for — it is the only thing
            # someone landing on a branch holding one bare .ndjson file can read.
            $subject = if ($parent) {
              'chore(bench): append perf history [perf-history]'
            } else {
              'chore(bench): start the perf trend — one line per push to main, see bench/README.md [perf-history]'
            }
            $commitArgs = @('commit-tree', $tree, '-m', $subject)
            if ($parent) { $commitArgs += @('-p', $parent) }
            $commit = (git @commitArgs).Trim()

            # Fast-forward by construction — the parent IS the tip just read. A
            # concurrent main push moves the tip and this is rejected, so the
            # retry re-reads and re-appends onto the new tip.
            git push origin "${commit}:refs/heads/$branch"
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              Write-Host "Published the trend line to '$branch' ($commit). Trend length: $($all.Count)."
            } elseif ($attempt -lt 3) {
              Write-Host "Push rejected (attempt $attempt) — re-reading the tip and retrying."
              Start-Sleep -Seconds 5
            }
          }

          if (-not $pushed) {
            $msg = "The perf trend line was NOT published to '$branch' after 3 attempts. The trend is what distinguishes a real regression from CI noise, and losing it quietly is how six weeks of it disappeared (#602)."
            Write-Host "::error::$msg"
            '> [!CAUTION]' | Add-Content $env:GITHUB_STEP_SUMMARY
            "> $msg It survives in this run's uploaded artifact and can still be appended by hand." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          # Loud, never fatal: a lost trend line must not fail the perf gate.
          exit 0

  # #940: the fresh-runner confirmation. Runs on exactly one condition — the
  # bench job's gate went red AND the red reproduced on that same runner, the
  # one case a same-machine re-run cannot settle (it separates a transient
  # spike from a repeatable one, but not a code regression from a runner
  # degraded for its whole lifetime). This job re-measures the failing legs on
  # a different machine and CARRIES THE GATE'S VERDICT: reproduced here → red
  # on a second machine, the strongest claim the pipeline can make; not
  # reproduced → runner-health noise, green with the reasoning in the summary.
  # perf-confirm-fresh.mjs fails closed on everything else, and binds the
  # cross-job handshake to the commit: the escalation artifact must name the
  # SHA this job checked out itself, or it refuses to run.
  #
  # The checkout pins `github.sha` explicitly: for pull_request events the
  # default ref is re-resolved at fetch time, so a base branch that moved
  # between the two jobs would hand this job a DIFFERENT merge commit — the
  # commit check would then fail closed, spending a packaged build to learn
  # the artifact is stale. Pinning measures the same commit the bench did.
  bench-confirm:
    needs: bench
    if: needs.bench.outputs.fresh-confirm-needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package app
        run: npm run package

      - name: Download first-run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-${{ github.run_id }}
          path: first

      # Same single-line exit-code contract as the bench job's compare step,
      # pinned by perfWorkflow.test.mjs: this command's exit code IS the job's
      # verdict, nothing chained after it, no continue-on-error anywhere.
      - name: Confirm on this runner
        run: node scripts/perf-confirm-fresh.mjs --escalation first/out/perf-escalation.json --current first/out/perf-current.json --baseline bench/baseline-ci.json --json out/perf-fresh.json --summary perf-summary-fresh.md

      - name: Append summary to step summary
        if: always()
        run: |
          if (Test-Path perf-summary-fresh.md) {
            Get-Content perf-summary-fresh.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      # Both machines' samples must leave the runners — this pair is exactly
      # the evidence a runner-health investigation needs.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-fresh-${{ github.run_id }}
          path: |
            out/perf-fresh.json
            perf-summary-fresh.md
          if-no-files-found: ignore

  # The cross-job artifact contract, exercised on every run that reaches it.
  #
  # `bench-confirm` is the only other job that downloads, and it is gated on a
  # reproduced red (`fresh-confirm-needed`), so on a normal green run nothing
  # ever proves the upload/download round trip still works. That gap is how an
  # artifact-action upgrade could land "green" while silently breaking the
  # escalation path — which only shows up later, on the run that actually needs
  # it. This job closes that gap without touching `bench-confirm`'s trigger:
  # perfWorkflow.test.mjs pins that `if:` string exactly (#940), and loosening
  # it to force a run would break the contract it exists to protect.
  artifact-contract:
    needs: bench
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download the bench job's artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-${{ github.run_id }}
          path: first

      # Same destination shape bench-confirm uses (`first/out/...`), so this
      # asserts the exact layout that job depends on, not merely that some
      # bytes arrived.
      - name: Assert the artifact survived the round trip
        shell: pwsh
        run: |
          if (-not (Test-Path first/out/perf-current.json)) {
            Get-ChildItem -Recurse first | ForEach-Object { $_.FullName }
            throw "first/out/perf-current.json is missing: the cross-job artifact round trip is broken"
          }
          Write-Host "artifact contract OK: first/out/perf-current.json present"
