name: Flaky tests weekly

# The week's flaky tests in one issue. Every CI run retries a failed test once
# and records the retried tests (scripts/vitest-retry-reporter.mjs);
# scripts/flaky-report.mjs shows them on that run's summary, and a run with a
# retried test uploads them as a `test-report-retries-*` artifact. A green run hides them, though, and a flake that turns
# up once a day in a different pull request never looks like much on its own.
# scripts/flaky-weekly.mjs reads the reports of every completed run of ci.yml,
# ci-cross-platform-baseline.yml, runtime.yml and windows.yml from the last
# seven days and opens "Flaky tests: week of <Monday>", labelled `flaky`, with
# one row per test and the number of runs it needed the retry in. A week with
# no retry opens nothing. It runs:
#
# - every Monday, for the week that just ended;
# - on demand: `gh workflow run flaky-weekly.yml` (or "Run workflow" in the
#   Actions tab). It covers the seven days before the dispatch and names the
#   issue after the Monday that window starts in, so a mid-week dispatch
#   rewrites last Monday's issue (if still open) with a shifted window; the
#   body states the window it covers.
#
# It only reads report JSON and runs on node built-ins and gh: no `npm ci`.
on:
  schedule:
    # 00:17 UTC Monday = 09:17 KST. Off the hour: scheduled runs on :00 queue longest.
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: flaky-weekly
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    # One `gh run download` per run that uploaded a report, a few hundred a
    # week; the cap only stops a hang.
    timeout-minutes: 30
    steps:
      # Same pins as validate in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '>=24.21.0 <25'

      - name: Open or update the weekly flaky-test issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/flaky-weekly.mjs --issue
