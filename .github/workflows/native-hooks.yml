name: Native hooks
# wmux-native (core/wmux-native): build it on every platform wmux ships, run
# its unit tests, and hold `wmux-native hook` to the shared Node bridge with
# the parity suite (envelope byte-for-byte, logs equivalent), which must run
# here (not skip). On macOS and Linux it also runs every Claude hook
# characterisation case against `wmux-native claude-hook`. `wmux-native
# mcp-shim` is held to src/mcp/shim.ts the same way, and its end-to-end test
# runs against the built broker bundle.
#
# It runs on every pull request so it can be a required check: the `changes`
# job decides whether the pull request touches anything the native bridge
# depends on (RELEVANT), and the platform jobs' steps run or no-op on that.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-hooks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Does this change touch the native bridge?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RELEVANT: '^(core/wmux-native/|integrations/shared/|integrations/claude/(bin/wmux-bridge\.mjs$|__tests__/)|src/shared/hooks/|src/main/pipe/|src/shared/lifecycleIntegrations\.ts$|src/shared/rpc\.ts$|src/cli/commands/setupHooks\.ts$|src/cli/commands/__tests__/setupHooks\.(native|downgrade)\.os\.test\.ts$|scripts/fetch-last-release-cli\.mjs$|scripts/__tests__/fetchLastReleaseCli\.test\.mjs$|scripts/lib/last-release\.mjs$|src/daemon/DaemonPipeServer\.ts$|src/main/mcp/hookBridge\.ts$|src/main/mcp/__tests__/hookBridge\.lockstep\.test\.ts$|src/mcp/(shim|broker)\.ts$|src/main/mcp/(nativeLauncher\.ts|__tests__/nativeLauncher\.os\.test\.ts)$|src/shared/(mcpLauncher\.ts|__tests__/mcpLauncher\.os\.test\.ts)$|src/mcp/__tests__/nativeShim\.parity\.os\.test\.ts$|src/shared/(constants|roleSurfaces|commanderSurface|coreSurface)\.ts$|scripts/build-mcp\.js$|scripts/build-native-hooks\.mjs$|scripts/__tests__/(buildNativeHooks\.os\.test|nativeHooksRelease\.test)\.mjs$|forge\.config\.ts$|package(-lock)?\.json$|\.github/workflows/(native-hooks|release)\.yml$)'
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          if grep -Eq "$RELEVANT" <<<"$files"; then echo "relevant=true"; else echo "relevant=false"; fi >> "$GITHUB_OUTPUT"

  native-hooks:
    needs: changes
    # Runs even when `changes` failed: without its answer, everything runs.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos-arm64 }
          - { os: windows-2022, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
    name: native-hooks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.relevant != 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.relevant != 'false'
        with:
          node-version: '>=24.21.0 <25'
          cache: npm
      - run: npm install -g npm@11
        if: needs.changes.outputs.relevant != 'false'
      - run: npm ci
        if: needs.changes.outputs.relevant != 'false'
      - name: Build the MCP bundle (the broker for the mcp-shim end-to-end test)
        if: needs.changes.outputs.relevant != 'false'
        run: npm run build:mcp
      - name: Install Rust toolchain
        if: needs.changes.outputs.relevant != 'false'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format, lint and unit tests
        if: needs.changes.outputs.relevant != 'false'
        working-directory: core/wmux-native
        env:
          WMUX_REQUIRE_BROKER_E2E: '1'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and stage the binary
        if: needs.changes.outputs.relevant != 'false'
        run: node scripts/build-native-hooks.mjs
      - name: Parity with the Node bridge and the Node MCP shim, lockstep, installer
        if: needs.changes.outputs.relevant != 'false'
        run: npx vitest run integrations/shared/__tests__/hooksBridgeNative.parity.os.test.ts src/mcp/__tests__/nativeShim.parity.os.test.ts integrations/shared/__tests__/hookFlavours.lockstep.test.ts integrations/shared/__tests__/hooksBridgeShells.os.test.ts src/shared/hooks/__tests__/compatHookInstall.os.test.ts src/main/mcp/__tests__/hookBridge.lockstep.test.ts scripts/__tests__/buildNativeHooks.os.test.mjs scripts/__tests__/nativeHooksRelease.test.mjs src/shared/__tests__/mcpLauncher.os.test.ts src/main/mcp/__tests__/nativeLauncher.os.test.ts src/shared/hooks/__tests__/claudeNativeHook.os.test.ts src/cli/commands/__tests__/setupHooks.native.os.test.ts
        env:
          WMUX_REQUIRE_NATIVE_HOOKS: '1'
          WMUX_NATIVE_HOOKS_BIN: ${{ github.workspace }}/dist/native-hooks/${{ runner.os == 'Windows' && 'wmux-native.exe' || 'wmux-native' }}
      - name: Claude hook characterisation against the native binary
        if: needs.changes.outputs.relevant != 'false'
        shell: bash
        run: |
          # The Claude hook is unix only: Windows keeps the Node bridge.
          if [ "$RUNNER_OS" = "Windows" ]; then echo "No native Claude hook on Windows."; exit 0; fi
          # Beside the binary, the Node bridge it hands decision modes to.
          stage="$RUNNER_TEMP/claude-hook"
          mkdir -p "$stage"
          cp dist/native-hooks/wmux-native integrations/claude/bin/wmux-bridge.mjs "$stage/"
          WMUX_CLAUDE_HOOK_IMPL="$stage/wmux-native claude-hook" npx vitest run integrations/claude/__tests__/claudeHookCharacterisation.os.test.ts integrations/claude/__tests__/claudeHookContract.test.ts
          # The argv a Claude settings entry carries: the bridge path in argv[1].
          # claudeHookContract.test.ts does not read WMUX_CLAUDE_HOOK_IMPL: once is enough.
          WMUX_CLAUDE_HOOK_IMPL="$stage/wmux-native $stage/wmux-bridge.mjs" npx vitest run integrations/claude/__tests__/claudeHookCharacterisation.os.test.ts
      - name: The last release's CLI against this build's native Claude entries
        # One platform is enough: the CLI bundle is plain JavaScript. The test
        # skips without WMUX_LAST_RELEASE_CLI, so here it must be set.
        if: needs.changes.outputs.relevant != 'false' && matrix.name == 'linux-x64'
        run: |
          # The script picks the newest vX.Y.Z tag; the checkout has none.
          git fetch --quiet --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          cli="$(node scripts/fetch-last-release-cli.mjs "$RUNNER_TEMP/last-release")"
          WMUX_LAST_RELEASE_CLI="$cli" npx vitest run src/cli/commands/__tests__/setupHooks.downgrade.os.test.ts
      - name: Retain the staged binary
        if: needs.changes.outputs.relevant != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wmux-native-${{ matrix.name }}
          path: dist/native-hooks/
          if-no-files-found: error
      - name: Nothing the native bridge depends on changed
        if: needs.changes.outputs.relevant == 'false'
        run: echo "No native bridge change in this pull request; nothing to build."
