name: CI

on:
  push:
    branches:
      - main
      - 'security-*'
  # Draft PRs do not run CI: every job below skips while the PR is a draft, and
  # marking it ready (`gh pr ready`) fires ready_for_review, which runs it.
  # Pushes to a draft used to restart ~10 queued jobs each time.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same PR supersedes the run in flight. A push to main or
# security-* gets a group of its own (its SHA): one shared group would still
# drop a queued run whenever a third push arrived, leaving that commit unchecked.
concurrency:
  # A draft PR's run (skipped by the jobs' draft check) gets its own group, so a
  # late synchronize event from before `gh pr ready` cannot cancel the ready run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `validate` runs the type checks, builds and the unit suite (`npm run
  # test:parallel`), split in two shards, in parallel. The runtime suite
  # (`npm run test:runtime`: real Chrome, ConPTY, the bundled daemon) is not
  # here: it runs nightly, on every push to main and on demand in runtime.yml,
  # so its timing-sensitive tests never block a pull request.
  validate:
    name: validate (${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    # The heavier shard takes ~8 min of tests; a hung step must not hold a
    # runner for the 6 h default.
    timeout-minutes: 35
    strategy:
      # Both shards report, so one red shard does not hide the other's failures.
      fail-fast: false
      matrix:
        # The unit suite alone took ~11 min of a ~15 min job on one runner.
        # Vitest splits files by path hash, not duration, and the heavy git
        # suites hash into shard 1 (~70% of the test time when measured), so
        # the checks before the tests run once, on shard 2.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor is the fix for #984: official Node 24.16.0-24.20.0 ship
          # libuv 1.52.1 without libuv/libuv#5152 and abort on a directory
          # watch under the runner's 8.3 `%TEMP%` (C:\Users\RUNNER~1),
          # killing a vitest fork. 24.21.0 carries the fix. A bare `24` is not
          # enough: it resolved from the runner's tool cache to 24.19.0.
          node-version: '>=24.21.0 <25'
          cache: npm

      # npm 11 owns package-lock.json (see CONTRIBUTING; npm 10's `npm ci`
      # rejects an npm-11-written lock). Node 24 bundles an npm 11 minor that
      # moves with the Node patch; installing the latest npm 11 keeps the
      # lineage guard below on the same npm as release.yml, perf.yml and
      # CONTRIBUTING.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # Lockfile lineage guard. npm 11 (this job's npm) accepts an npm-10-shaped
      # lock without complaint, so a contributor on npm 10 who follows the EUSAGE
      # error's own advice ("update your lock file with `npm install`") resurrects
      # the pruned nested entries at whatever the registry serves today — and CI
      # would stay green while the lineage silently regresses. Renormalizing here
      # must be a no-op; a diff means the committed lock was not written by npm 11.
      - name: Lockfile lineage guard (npm 11)
        if: matrix.shard == 2
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json

      # Every type-check program except mcp and daemon, which CI compiles with
      # the same tsconfig anyway: `build:mcp` and `build:daemon` below both
      # start with `tsc -p` (so a daemon type error fails the daemon build).
      # cli has no build step here, so it is checked.
      # Locally, `npm run typecheck` still runs all of them.
      # scripts/__tests__/typecheckSlices.test.mjs ties this list to those
      # build steps.
      - name: Type check
        if: matrix.shard == 2
        run: node scripts/typecheck.mjs --skip mcp,daemon

      - name: Build and probe MCP protocol
        if: matrix.shard == 2
        run: npm run build:mcp && npm run probe:mcp

      # The daemon bundle the runtime suite drives. That suite left the pull
      # request path (runtime.yml), but the build did not: it compiles the
      # daemon program the type check above skips, and a bundle that no longer
      # builds must fail the pull request that broke it, not the next nightly.
      - name: Build daemon bundle
        if: matrix.shard == 2
        run: npm run build:daemon

      # The push relay is a separate Cloudflare Worker deployment with its own
      # tsconfig (WebWorker libs, no @types/node — node-only code must not
      # typecheck here and then fail at the edge), so the root project's
      # `npm run typecheck` above never sees it.
      - name: Type check push relay
        if: matrix.shard == 2
        run: node_modules/.bin/tsc --noEmit -p relay/tsconfig.json

      # #1037 — locale drift ADVISORY, never a gate: lists keys whose English
      # blame is newer than the translation's (meaning may have drifted under
      # an unchanged key/placeholder set). The method false-positives on
      # reformats, so findings are for a human to judge; --check always exits 0.
      # The checkout stays shallow for every other step; `git blame` needs
      # history, so only this step deepens it. If that fetch fails, the script
      # warns "shallow checkout" instead of printing a false all-clear.
      - name: Locale drift advisory (#1037)
        if: matrix.shard == 2
        continue-on-error: true
        shell: bash
        run: |
          git fetch --unshallow --no-tags --quiet origin HEAD || true
          node scripts/locale-drift-report.mjs --check

      # Lint on the files added by the cross-platform port, which must stay
      # free of errors and warnings. Lint does not depend on the OS, so it
      # runs here once instead of on every Baseline leg. Keep it on ONE line:
      # PowerShell does not honor bash `\` line continuations.
      - name: ESLint (cross-platform files, strict)
        if: matrix.shard == 2
        run: npx eslint --max-warnings=0 src/shared/platform.ts src/shared/__tests__/platform.test.ts src/shared/ShellDetector.ts src/shared/__tests__/ShellDetector.test.ts src/shared/shellResolution.ts src/shared/__tests__/shellResolution.test.ts src/main/notification/__tests__/ToastManager.test.ts

      # The runtime suites (`*.runtime.test.*`) run in runtime.yml.
      - name: Test (unit suite, shard ${{ matrix.shard }}/2)
        run: npm run test:parallel -- --shard=${{ matrix.shard }}/2

  # The native Windows computer-use helper (native/computer-use-windows): the
  # C# unit tests, the NativeAOT publish main spawns in dev builds, and a smoke
  # run against Notepad on the runner's desktop (hello latency, listApps,
  # getAppState). Its own job, so a .NET problem never hides the TS suite.
  computer-use-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same Node as validate (see the comment there, #984).
          node-version: '>=24.21.0 <25'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Unit tests (tree, keys, unicode chunks, held-state file)
        run: dotnet test native/computer-use-windows/tests/WmuxComputerUse.Core.Tests -c Release

      - name: NativeAOT publish
        run: node native/computer-use-windows/build.mjs --no-stage

      # The exact exe this commit built, for dogfooding a PR on a real Windows
      # machine (docs/computer-use-windows.md). Uploaded before the smoke runs,
      # so a failing smoke still leaves the binary to debug.
      - name: Record the helper's SHA-256
        shell: pwsh
        run: |
          $exe = "native/computer-use-windows/dist/wmux-computer-use.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  wmux-computer-use.exe" | Set-Content -NoNewline -Encoding ascii "native/computer-use-windows/dist/wmux-computer-use.exe.sha256"
          Write-Host "wmux-computer-use.exe sha256=$hash"

      - name: Upload the helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wmux-computer-use-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native/computer-use-windows/dist/wmux-computer-use.exe
            native/computer-use-windows/dist/wmux-computer-use.exe.sha256
          retention-days: 7
          if-no-files-found: error

      # Hosted runners run as an elevated admin, where the helper must refuse
      # to start (exit 72): checked first. The full smoke then runs helper and
      # Notepad under a de-elevated, medium-integrity token (tools/RunLimited,
      # CI only, never shipped).
      - name: Build the de-elevating launcher and the hang target (CI only)
        run: |
          dotnet build native/computer-use-windows/tools/RunLimited -c Release -o native/computer-use-windows/tools/dist
          dotnet build native/computer-use-windows/tools/HangWindow -c Release -o native/computer-use-windows/tools/dist

      - name: Smoke run, elevated (the helper refuses to start)
        run: node native/computer-use-windows/smoke.mjs native/computer-use-windows/dist/wmux-computer-use.exe

      - name: Smoke run (hello, capabilities, listApps with Notepad open)
        timeout-minutes: 5
        run: node native/computer-use-windows/smoke.mjs native/computer-use-windows/dist/wmux-computer-use.exe --limited native/computer-use-windows/tools/dist/RunLimited.exe --hang native/computer-use-windows/tools/dist/HangWindow.exe --require-full
