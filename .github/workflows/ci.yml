name: CI

on:
  push:
    branches:
      - main
      - 'security-*'
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: node_modules/.bin/tsc --noEmit

      - name: Build and probe MCP protocol
        run: npm run build:mcp && npm run probe:mcp

      # The push relay is a separate Cloudflare Worker deployment with its own
      # tsconfig (WebWorker libs, no @types/node — node-only code must not
      # typecheck here and then fail at the edge), so the root project's
      # `tsc --noEmit` above never sees it.
      - name: Type check push relay
        run: node_modules/.bin/tsc --noEmit -p relay/tsconfig.json

      - name: Test
        run: npm test
