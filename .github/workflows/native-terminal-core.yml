name: Native terminal core
on:
  pull_request:
    paths: ['core/wmux-term/**', 'src/daemon/**', 'src/shared/**', 'src/main/pty/**', 'src/main/ipc/handlers/*terminalCore*', 'src/renderer/components/Settings/**', 'bench/native-core-verify.ts', 'bench/native-interpreter-verify.ts', 'bench/fixtures/**', 'scripts/*native*', 'scripts/lib/native-terminal-targets.mjs', 'scripts/*rust*', 'scripts/__tests__/generateRustUnicode11.os.test.mjs', 'scripts/__tests__/nativeTerminalPackage.os.test.mjs', '.github/workflows/release.yml', 'forge.config.ts', 'package.json', 'package-lock.json', '.github/workflows/native-terminal-core.yml', '.github/workflows/rust-engine-daemon.yml', 'vitest.rust-engine.config.ts', 'src/test-utils/requireRustEngine.ts', 'core/harness/corpus/**', 'src/renderer/terminal/__tests__/fixtures/**']
  workflow_dispatch:
    inputs:
      soak:
        description: Run a four-hour PTY soak on each hosted OS
        type: boolean
        default: false
jobs:
  native-terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.21.0 <25'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Windows input baseline (diagnostic)
        if: runner.os == 'Windows'
        # Bound cleanup too: the diagnostic must not prevent native qualification
        # or artifact retention if node-pty's ConPTY close itself blocks.
        run: node -e "const r=require('node:child_process').spawnSync(process.execPath,['bench/fixtures/windows-input-control.cjs'],{stdio:'inherit',timeout:330000,killSignal:'SIGKILL'}); if(r.error) console.error(r.error.message);"
      - name: Retain Windows input baseline
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-input-control
          path: |
            out/windows-input-control.json
            out/node-input-progress.json
          if-no-files-found: ignore
      - name: Unicode generation and packaging contracts across checkout line endings
        run: npx vitest run scripts/__tests__/generateRustUnicode11.os.test.mjs scripts/__tests__/nativeTerminalPackage.os.test.mjs
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Rust interpreter and grid unit tests
        run: cargo test --manifest-path core/wmux-term/Cargo.toml --no-default-features --locked
      - name: Native core unit tests
        run: cargo test --manifest-path core/wmux-term/Cargo.toml --features native-core --locked
      # The vendored crate is not a workspace member (it has dev-dependencies),
      # so its own tests run from its manifest, against its own lock.
      - name: Vendored Alacritty unit tests
        run: cargo test --manifest-path core/wmux-term/vendor/alacritty_terminal/Cargo.toml --locked
      - run: npm run test:terminal-core -- --report=native-terminal-report.json
      # Electron 42 dropped its postinstall download: `npm ci` leaves no binary
      # under node_modules/electron/dist, so fetch it before `npx electron`.
      - name: Install the Electron binary
        run: npx install-electron
      - name: Electron main load and PTY
        if: runner.os != 'Linux'
        run: npx electron core/wmux-term/spike/native-transport-electron.cjs
      - name: Electron main load and PTY (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox core/wmux-term/spike/native-transport-electron.cjs
      - name: Backend, snapshot, input and lifecycle contracts
        run: npx vitest run src/shared/__tests__/terminalPty.os.test.ts src/shared/__tests__/terminalCoreSettings.os.test.ts src/daemon/__tests__/RingBuffer.test.ts src/daemon/__tests__/BufferHibernation.os.test.ts src/daemon/__tests__/DaemonPTYBridge.nativeOutput.test.ts src/daemon/__tests__/SessionPipe.inputBackpressure.os.test.ts src/main/pty/__tests__/PTYManager.wsl.test.ts src/main/ipc/handlers/__tests__/terminalCore.handler.test.ts src/renderer/components/Settings/__tests__/TerminalEngineSetting.test.tsx src/daemon/__tests__/sessionReattach.engines.os.test.ts src/daemon/__tests__/paneHangup.engines.os.test.ts src/daemon/__tests__/nativeProcessTable.parity.os.test.ts
        env:
          # The module is built above, so on macOS and Linux its rust cases
          # must run, not skip. The suite is POSIX only: Windows skips it.
          WMUX_REQUIRE_RUST_CORE: '1'
          # The checkout's build is never found on its own: name it.
          WMUX_TERMINAL_CORE_MODULE: ${{ github.workspace }}/core/wmux-term/dist/native-core/index.cjs
      # An idle daemon starts no process: the real daemon bundle with a few
      # sessions, its forks and execs counted by strace over an idle window.
      # strace attaches through sudo (Yama's ptrace_scope refuses a non-child).
      - name: Idle daemon starts no process (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v strace || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends strace; }
          npm run build:daemon
          npx vitest run src/daemon/__tests__/idleForks.linux.os.test.ts
        env:
          WMUX_IDLE_FORK_TEST: '1'
          WMUX_REQUIRE_RUST_CORE: '1'
          WMUX_TERMINAL_CORE_MODULE: ${{ github.workspace }}/core/wmux-term/dist/native-core/index.cjs
      # The daemon's /proc readers answer what `ps` answers, on a real Linux.
      - name: /proc readers match ps (Linux)
        if: runner.os == 'Linux'
        run: |
          npx vitest run src/daemon/__tests__/procfs.linux.os.test.ts
          npx vitest run --config vitest.runtime.config.ts src/daemon/__tests__/ProcessMonitor.runtime.test.ts
      # The same comparison against procps 4 (ubuntu-22.04 ships 3.3), in an
      # ubuntu:24.04 container running this job's node.
      - name: /proc readers match procps 4 (Linux)
        if: runner.os == 'Linux'
        run: |
          prefix="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm -v "$PWD:/w" -v "$prefix:$prefix:ro" -w /w ubuntu:24.04 bash -euc "
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq procps tzdata > /dev/null
            ps -V
            '$prefix/bin/node' node_modules/vitest/vitest.mjs run src/daemon/__tests__/procfs.linux.os.test.ts"
      # Stub WMUX_RUST_SNAPSHOT_MODULE, which WMUX_TERMINAL_CORE_MODULE would override.
      - name: Opt-in snapshot module contracts
        run: npx vitest run src/daemon/__tests__/TextSnapshotBackend.test.ts src/daemon/__tests__/AnsiSnapshotBackend.test.ts src/daemon/__tests__/RustSnapshot.test.ts
      # The unit lane builds no module, so on CI these suites skip there. Here
      # the module is built: name it and require it, so a missing module fails
      # instead of skipping. Every Rust*Parity suite in the tree runs, so a new
      # or renamed one cannot drop out. Linux is left out: the linux-rust-daemon
      # job below already runs them with the built module required.
      - name: Rust snapshot parity with xterm (built module required)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          suites=(src/daemon/__tests__/Rust*Parity.test.ts)
          [ -e "${suites[0]}" ] || { echo "no Rust*Parity suite found"; exit 1; }
          npx vitest run "${suites[@]}"
        env:
          WMUX_REQUIRE_RUST_CORE: '1'
          WMUX_RUST_SNAPSHOT_MODULE: ${{ github.workspace }}/core/wmux-term/dist/native-core/index.cjs
      - name: Output interpretation contracts
        run: npx vitest run src/daemon/__tests__/OutputInterpreter.test.ts src/daemon/util/__tests__/outputModeTracker.test.ts src/main/pty/__tests__/OscParser.test.ts
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-terminal-${{ matrix.os }}
          path: |
            native-terminal-report.json
            out/native-soak-mismatch-*.json
            out/native-input-progress.json
          if-no-files-found: ignore
  # Daemon tests on the rust engine, on Linux. The job lives in its own
  # workflow so its nightly runs (and their red-run issue) stay apart from
  # these pull request runs.
  linux-rust-daemon:
    uses: ./.github/workflows/rust-engine-daemon.yml
  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # This job is a four-hour screening run. The continuous eight-hour gate
    # uses the documented local command; do not combine shorter runs as evidence.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.21.0 <25'
      - run: npm install -g npm@11
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: npm run test:terminal-core -- --report=native-terminal-soak-report.json
        env:
          WMUX_NATIVE_SOAK_MS: '14400000'
      - name: Retain soak evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-terminal-soak-${{ matrix.os }}
          path: |
            native-terminal-soak-report.json
            out/native-soak-mismatch-*.json
          if-no-files-found: ignore
