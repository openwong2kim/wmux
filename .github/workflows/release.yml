name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-14
            target: mac-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # ───────────────────────────────── Windows ─────────────────────────────────
      - name: Build & Make (Windows)
        if: matrix.target == 'win'
        run: npm run make

      - name: Upload artifacts (Windows)
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: wmux-windows
          path: out/make/**/*

      - name: Create GitHub Release (Windows assets)
        if: matrix.target == 'win'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          generate_release_notes: true
          draft: false

      - name: Get version from package.json (Windows)
        if: matrix.target == 'win'
        id: pkg
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Compute Setup.exe checksum
        if: matrix.target == 'win'
        id: checksum
        run: |
          $exe = Get-ChildItem "out/make/squirrel.windows/x64/*Setup.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build Chocolatey package
        if: matrix.target == 'win'
        run: |
          $version = "${{ steps.pkg.outputs.version }}"
          $sha256  = "${{ steps.checksum.outputs.sha256 }}"
          # Inject version into nuspec
          (Get-Content chocolatey/wmux.nuspec) -replace '\$version\$', $version | Set-Content chocolatey/wmux.nuspec
          # Inject checksum into install script
          (Get-Content chocolatey/tools/chocolateyInstall.ps1) -replace '__CHECKSUM_SHA256__', $sha256 | Set-Content chocolatey/tools/chocolateyInstall.ps1
          choco pack chocolatey/wmux.nuspec --output-directory out/choco
          # Restore originals so git stays clean
          git checkout -- chocolatey/
        shell: pwsh

      - name: Push to Chocolatey
        if: matrix.target == 'win' && env.CHOCO_API_KEY != ''
        continue-on-error: true
        run: choco push out/choco/wmux.${{ steps.pkg.outputs.version }}.nupkg --source https://push.chocolatey.org --api-key ${{ secrets.CHOCO_API_KEY }}
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}

      - name: Publish to winget
        if: matrix.target == 'win' && env.WINGET_TOKEN != ''
        continue-on-error: true
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: openwong2kim.wmux
          version: ${{ steps.pkg.outputs.version }}
          installers-regex: '\.Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      # ───────────────────────────────── macOS ─────────────────────────────────
      - name: Import Apple code signing certificate
        if: matrix.target == 'mac-arm64'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build macOS app (signed + notarized)
        if: matrix.target == 'mac-arm64'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make -- --platform=darwin --arch=arm64

      - name: macOS code signing smoke check
        if: matrix.target == 'mac-arm64'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find out -name "wmux.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: wmux.app not found"; exit 1; fi
          echo "App path: $APP_PATH"

          # 1. App bundle signature verification
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          # 2. node-pty native binding signature + entitlements applied
          PTY_NODE=$(find "$APP_PATH" -name "pty.node" | head -1)
          if [ -z "$PTY_NODE" ]; then echo "ERROR: pty.node not found"; exit 1; fi
          echo "pty.node: $PTY_NODE"
          codesign -dvvv "$PTY_NODE" 2>&1 | grep -E "Identifier|Authority|Entitlements" || echo "WARN: codesign output unexpected"

          # 3. Gatekeeper assessment
          spctl -a -t exec -vvv "$APP_PATH"

          # 4. Notarization ticket stapling check
          xcrun stapler validate "$APP_PATH"

          echo "All macOS smoke checks passed"

      - name: Upload macOS DMG artifact
        if: matrix.target == 'mac-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: wmux-macos-arm64
          path: out/make/**/*.dmg

      - name: Attach macOS DMG to GitHub Release
        if: matrix.target == 'mac-arm64'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/**/*.dmg
          # Win job above already generated release notes for this tag.
          # Re-generating here would race and overwrite them with macOS-only
          # content (or duplicate sections). Keep notes single-sourced from Win.
          generate_release_notes: false
          draft: false
          fail_on_unmatched_files: true
