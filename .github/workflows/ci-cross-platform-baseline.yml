name: CI Cross-Platform Baseline

# Baseline workflow exercising the unix branches of the codebase that have
# never been run in CI. Result is informational — this is NOT a release gate
# and no other workflow should `needs:` it. First runs are expected to fail
# on macOS/Linux (45 known `process.platform === 'win32'` branches, of which
# the unix sides have never been executed). Failures get triaged via the
# cross-platform fix budget, not by blocking merges.

# Branch pushes are covered by the pull_request trigger. Listing 'feat/**' /
# 'feature/**' under push as well ran this whole 3-OS matrix TWICE for every
# push to a branch with an open PR — double the minutes and double the exposure
# to runner flakes, with the push-event copy painting a red X on the commit even
# when the PR's own copy was green. ci.yml already uses push-on-main + PR; this
# now matches it.
on:
  push:
    branches:
      - main
  # Drafts skip the job; marking the PR ready runs it (see ci.yml).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A draft PR's run (skipped by the jobs' draft check) gets its own group, so a
  # late synchronize event from before `gh pr ready` cannot cancel the ready run.
  group: baseline-${{ github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  # Safe to cancel anywhere: this workflow is informational and writes nothing
  # (unlike perf.yml, whose main runs append to the history file at the end).
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    # The slowest leg (macos) takes ~17 min; a hung test must not hold a
    # runner for the 6 h default.
    timeout-minutes: 30
    strategy:
      # Per DX/Eng review T1 (per-OS independent publish policy): keep all
      # matrix legs running so we can see the full cross-platform picture
      # even if one OS regresses.
      fail-fast: false
      # No windows leg: it ran `npm test` serially, the same suites ci.yml
      # already runs on windows-latest, and was the slowest job on every PR.
      matrix:
        os:
          - macos-14         # Apple Silicon
          - ubuntu-22.04     # Linux baseline

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js + npm 11
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22, not ci.yml's 24 floor (#984, a Windows-only libuv bug): on
          # Node 24 macOS rejects the >104-byte unix socket paths the
          # SessionPipe and DaemonClient tests build under its long $TMPDIR
          # (EINVAL), where Node 22 truncated them silently. That is its own
          # follow-up.
          node-version: '22'
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      # node-pty builds from source on Linux (no prebuilt for Electron's ABI).
      # build-essential pulls in gcc/g++/make; libxss1 is required by Electron
      # at runtime/link-time on headless Linux runners.
      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: |
          # build-essential and libxss1 come from the Ubuntu archives, but
          # `apt-get update` fails hard on ANY configured repo — and GitHub's
          # images preconfigure third-party ones this job never installs from.
          # On 2026-07-17 the Microsoft prod repo returned 403 on jammy
          # InRelease, update exited 100, and the job died over a repo we don't
          # use. Drop those sources by CONTENT, not filename: the same host is
          # spread across differently-named files (microsoft-prod.list,
          # azure-cli.list, …), so a filename glob misses some. Matching the
          # host also survives a runner bump to deb822 (24.04 keeps the Ubuntu
          # archives in sources.list.d/ubuntu.sources, which must NOT be dropped).
          #
          # Dropping the third-party sources removes the deterministic 403, but
          # the Ubuntu/Azure mirrors themselves still fail transiently (Hash Sum
          # mismatch, connection reset, 5xx from a single mirror behind the load
          # balancer). Acquire::Retries only retries the individual fetch inside
          # one apt run; a mirror serving a stale index fails the whole run. Wrap
          # both apt operations in a bounded retry with backoff so a slow/soggy
          # mirror costs seconds instead of a red X on an unrelated PR.
          set -euo pipefail
          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "apt-get $* failed (attempt ${attempt}/3); retrying after $((attempt * 15))s"
                sleep $((attempt * 15))
              fi
            done
            echo "apt-get $* failed after 3 attempts" >&2
            return 1
          }
          sudo bash -c 'grep -rlE "packages\.microsoft\.com|dl\.google\.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r rm -f'
          apt_retry update
          apt_retry install -y build-essential libxss1

      # macos-14 (Apple Silicon) ships with Xcode Command Line Tools preinstalled.
      # We only verify presence — do NOT attempt to install, that would burn
      # ~10 minutes and is unnecessary on GitHub-hosted runners.
      - name: Verify macOS Xcode CLT
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          clang --version
          make --version | head -n 1

      # postinstall runs scripts/fix-node-pty.js, which now early-exits on
      # non-Windows platforms (process.platform !== 'win32' guard, v2.7.3+).
      - name: Install dependencies (cross-platform)
        run: npm ci

      # No type check here. Type errors do not depend on the OS, and the one
      # disk-dependent case, an import whose casing differs from the file, is
      # checked by scripts/typecheck.mjs against the disk itself. Running it on
      # three runners added no signal, and on macos-14 (7 GB RAM) the old
      # single-program check ran out of the default V8 heap. ci.yml type-checks
      # once with scripts/typecheck.mjs; the mcp and daemon programs are
      # compiled by the checks job's build:mcp and build:daemon steps.

      # No lint here. Lint does not depend on the OS: ci.yml runs the strict
      # lint on the cross-platform files once. The repo-wide advisory lint that
      # ran on every leg was expected to fail (#1287) and gated nothing.

      - name: Test (cross-platform)
        run: npm test

      # Retried tests from both suites `npm test` runs; see the same two steps
      # in ci.yml.
      - name: Flaky test report
        if: ${{ !cancelled() }}
        run: node scripts/flaky-report.mjs test-results

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-baseline-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
