name: Windows full suite

# Every test lane on Windows: `npm run test:parallel` (the unit lane and the
# integration lane together; scripts/lib/test-lanes.mjs). On a pull request the
# unit lane runs on Linux (ci.yml, validate) and only the integration lane runs
# on Windows, because a file that touches the OS or mentions win32 is in that
# lane and the rest is OS-agnostic by construction. This workflow is the net
# under that construction: a pure-logic test that breaks on Windows without
# naming it is caught here, within a day of landing rather than at release.
# It runs:
#
# - nightly, on main;
# - on every push to main, so a regression is pinned to a merge or a short
#   range of merges. A newer push cancels the run in flight, so a burst of
#   merges costs two Windows runners once;
# - on a ready (non-draft) pull request that touches scripts/, a vite or
#   vitest config, the shared test setup (src/test-utils/), .gitattributes,
#   package.json or its lockfile, or this file. Those load into every suite
#   (or, for a vite or vitest upgrade, change the transform itself), but
#   their own tests sit in the unit lane, which a pull request runs on Linux
#   only; a CRLF checkout broke them on Windows alone (#2769). Such a run
#   takes only the unit lane (ci.yml already runs the integration lane on
#   Windows) and skips the firewall round trip: two Windows shards per push.
# - on demand: `gh workflow run windows.yml --ref <branch>` for a pull request
#   that touches platform code without saying win32.
#
# Nothing requires this workflow to pass. A red run on main opens a
# `Nightly red: <workflow>` issue (scripts/ci-failure-issue.mjs), which the
# triage bot picks up; the next green run closes it.
on:
  schedule:
    # 17:53 UTC = 02:53 KST. Off the hour: scheduled runs on :00 queue longest.
    - cron: '53 17 * * *'
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/**'
      - 'vite*.config.*'
      - 'vitest*.config.*'
      - 'src/test-utils/**'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
      # A vite or vitest upgrade changes the transform itself (#2769).
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes to main share one group and supersede each other. A pull request's
  # runs share a group of their own (its ref) and supersede each other only.
  # The nightly and manual runs get their own groups, so a merge or a pull
  # request never cancels them. A draft's run (skipped by the job's draft
  # check) gets its own group, as in ci.yml, so a late event from before
  # `gh pr ready` cannot cancel the ready run.
  group: windows-${{ github.event_name }}-${{ github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows (${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    # Both lanes on one runner took ~8 min of tests per shard before the
    # lanes; the cap only stops a hang.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Same pins and toolchain as validate in ci.yml; see the comments there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: '>=24.21.0 <25'
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      # See the checks job in ci.yml for the key.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'patches/**', 'scripts/fix-node-pty.js', 'scripts/apply-patches.mjs') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Electron 42 no longer downloads its binary on install, and a restored
      # node_modules cache may hold a tree without one. The integration lane
      # has a real-Electron leg (shareReader.os.test.ts) that skips without
      # it, so fetch it every run; it is a no-op when the binary is there.
      - name: Install the Electron binary
        run: npx install-electron

      - name: Test (both lanes, shard ${{ matrix.shard }}/2)
        if: github.event_name != 'pull_request'
        run: npm run test:parallel -- --shard=${{ matrix.shard }}/2

      # A pull request: the unit lane only, the one it does not run on Windows.
      - name: Test (unit lane, shard ${{ matrix.shard }}/2)
        if: github.event_name == 'pull_request'
        run: npm run test:unit -- --shard=${{ matrix.shard }}/2

      # Remote pairing's firewall Fix, for real: creates, probes and removes
      # Windows Firewall rules in group wmux-ci, through the same
      # ShellExecuteExW runas path the app uses (this runner's user is an
      # administrator with UAC off, so nothing prompts). The test skips
      # wherever this variable is not set, so it never writes a rule on a
      # developer's machine or in ci.yml, and it removes the whole wmux-ci
      # group when it ends. One shard is enough. It runs even when the test
      # step above failed (a known flake must not hide a firewall regression),
      # but not on a cancelled run.
      - name: Firewall round trip (group wmux-ci)
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name != 'pull_request' }}
        env:
          WMUX_FIREWALL_ROUNDTRIP: '1'
        run: npx vitest run --project integration src/main/net/__tests__/firewallRoundtrip.os.test.ts

      # The test removes group wmux-ci when it ends; this runs whatever
      # happened to it (a failed assertion, a crashed or timed-out worker), so
      # the runner is left with no wmux-ci rule. Only that group, never wmux.
      - name: Firewall round trip cleanup (group wmux-ci)
        if: always() && matrix.shard == 1 && github.event_name != 'pull_request'
        shell: powershell
        run: Remove-NetFirewallRule -Group 'wmux-ci' -ErrorAction SilentlyContinue

      # Same as validate's two steps in ci.yml: list tests that passed only on
      # retry (one report per lane, retries-unit.json and
      # retries-integration.json) and keep them, so a unit test that is flaky
      # only on Windows shows up here rather than nowhere.
      - name: Flaky test report
        id: flaky
        if: ${{ !cancelled() }}
        run: node scripts/flaky-report.mjs test-results

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-windows-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

      # The retry reports on their own, only when one lists a retried test,
      # for the weekly rollup (scripts/flaky-weekly.mjs): it downloads these
      # and nothing else, so a run without a retry costs it no API call.
      - name: Upload retry report
        if: ${{ !cancelled() && steps.flaky.outputs.retried == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-retries-windows-${{ matrix.shard }}
          path: test-results/retries-*.json
          if-no-files-found: ignore

  # After the test jobs, whatever happened to them (a timeout included),
  # on main: one red run opens (or comments on) the `Nightly red: <workflow>`
  # issue so the triage bot sees it, and a green one closes it. A job of its
  # own, not a last step in the test job, because a timed-out job never runs
  # its own `if: failure()` step, and the two shards would race to report.
  # scripts/lib/ci-failure-issue.mjs has the rules.
  report:
    name: Report to issue
    needs: windows
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Files and closes the issue (issues), reads the run's jobs and recent
    # runs (actions) and a cancelled job's annotations (checks: a timeout).
    # The workflow default stays read-only.
    permissions:
      contents: read
      issues: write
      actions: read
      checks: read
    steps:
      # Same pins as validate in ci.yml. Node built-ins and gh only: no npm ci.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.21.0 <25'

      - name: Open, update or close the nightly issue
        run: node scripts/ci-failure-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}
